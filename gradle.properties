# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with native access enabled for Java 21+
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Build optimizations
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin Multiplatform settings
kotlin.mpp.androidPluginDeprecation.nowarn=true


