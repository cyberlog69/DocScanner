name: Build iOS & Android (KMP)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS KMP Framework
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin Native Framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Compile Kotlin Native Framework for iOS Device
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScannerKit-iOS-Framework
          path: shared/build/bin/iosArm64/releaseFramework/
