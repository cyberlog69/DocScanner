name: Build iOS & Android (KMP)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared and Android unit tests
        run: ./gradlew :shared:testAndroidHostTest :app:testGithubDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleGithubDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: docscanner-android-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

  build-ios:
    name: Build iOS KMP Framework
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin Native Framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Compile Kotlin Native Framework for iOS Device
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Package iOS .ipa for Sideloading
        run: |
          mkdir -p build/ios/Payload/DocScanner.app
          
          # Copy Info.plist and enforce explicit bundle properties for Sideloadly / AltStore
          cp iosApp/iosApp/Info.plist build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleIdentifier -string "com.example.docscanner" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleExecutable -string "DocScanner" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleName -string "DocScanner" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleDisplayName -string "DocScanner" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundlePackageType -string "APPL" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleDevelopmentRegion -string "en" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.9.1" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace CFBundleVersion -string "12" build/ios/Payload/DocScanner.app/Info.plist
          plutil -replace MinimumOSVersion -string "16.0" build/ios/Payload/DocScanner.app/Info.plist
          
          # Compile Swift sources and statically link DocScannerKit into single executable Mach-O binary
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk $SDK_PATH \
            -target arm64-apple-ios16.0 \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework UIKit \
            -framework SwiftUI \
            -framework VisionKit \
            -framework Vision \
            -framework LocalAuthentication \
            -framework PDFKit \
            -framework DocScannerKit \
            -o build/ios/Payload/DocScanner.app/DocScanner \
            iosApp/iosApp/iOSApp.swift \
            iosApp/iosApp/ContentView.swift \
            iosApp/iosApp/ScannerView.swift \
            iosApp/iosApp/DocumentListView.swift \
            iosApp/iosApp/DocumentDetailView.swift \
            iosApp/iosApp/SettingsView.swift \
            iosApp/iosApp/OcrService.swift
          
          # Copy app icons and compile Assets.car catalog for Springboard / Home Screen display
          cp iosApp/iosApp/*.png build/ios/Payload/DocScanner.app/ 2>/dev/null || true
          if [ -d "iosApp/iosApp/Assets.xcassets" ]; then
            xcrun actool iosApp/iosApp/Assets.xcassets \
              --compile build/ios/Payload/DocScanner.app \
              --platform iphoneos \
              --minimum-deployment-target 16.0 \
              --app-icon AppIcon \
              --output-partial-info-plist build/ios/partial-info.plist 2>/dev/null || true
          fi
          
          # Ensure clean bundle for Sideloadly / AltStore signing
          rm -rf build/ios/Payload/DocScanner.app/_CodeSignature
          
          # Package into .ipa archive
          cd build/ios
          zip -r DocScanner.ipa Payload

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v6
        with:
          name: DocScannerKit-iOS-Framework
          path: shared/build/bin/iosArm64/releaseFramework/

      - name: Upload iOS .ipa Sideload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: DocScanner-iOS-IPA
          path: build/ios/DocScanner.ipa

  release:
    name: Publish Signed Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ALIAS: ${{ secrets.DOCSCANNER_KEY_ALIAS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Fails rather than publishing an unsigned APK when a secret is missing.
      - name: Import signing material
        env:
          NEW_KEYSTORE: ${{ secrets.DOCSCANNER_KEYSTORE_BASE64 }}
          OLD_KEYSTORE: ${{ secrets.DOCSCANNER_OLD_KEYSTORE_BASE64 }}
          LINEAGE: ${{ secrets.DOCSCANNER_LINEAGE_BASE64 }}
          NEW_STORE_PASSWORD: ${{ secrets.DOCSCANNER_STORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.DOCSCANNER_KEY_PASSWORD }}
          OLD_PASSWORD: ${{ secrets.DOCSCANNER_OLD_STORE_PASSWORD }}
        run: |
          for name in NEW_KEYSTORE OLD_KEYSTORE LINEAGE NEW_STORE_PASSWORD NEW_KEY_PASSWORD OLD_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret for signing ($name)"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$NEW_KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing/new.keystore"
          printf '%s' "$OLD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing/old.keystore"
          printf '%s' "$LINEAGE" | base64 -d > "$RUNNER_TEMP/signing/lineage.bin"
          chmod 600 "$RUNNER_TEMP"/signing/*

      # Built unsigned on purpose: Gradle cannot attach a v3 rotation lineage,
      # so signing happens with apksigner after the APK is assembled.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Sign APK with rotation lineage
        id: sign
        env:
          NEW_STORE_PASSWORD: ${{ secrets.DOCSCANNER_STORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.DOCSCANNER_KEY_PASSWORD }}
          OLD_PASSWORD: ${{ secrets.DOCSCANNER_OLD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          SIGNING="$RUNNER_TEMP/signing"

          UNSIGNED=$(find app/build/outputs/apk/github/release -name '*unsigned*.apk' -print -quit)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No unsigned release APK produced"
            exit 1
          fi

          OUT_DIR="$RUNNER_TEMP/release"
          mkdir -p "$OUT_DIR"
          ALIGNED="$OUT_DIR/aligned.apk"
          SIGNED="$OUT_DIR/DocScanner-Android-${GITHUB_REF_NAME}.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          # Old signer first so API 24-27 verify v2 against the retired key;
          # the new signer plus --lineage is the v3 rotation proof for API 28+.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGNING/old.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:OLD_PASSWORD --key-pass env:OLD_PASSWORD \
            --next-signer \
            --ks "$SIGNING/new.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:NEW_STORE_PASSWORD --key-pass env:NEW_KEY_PASSWORD \
            --lineage "$SIGNING/lineage.bin" --rotation-min-sdk-version 28 \
            --out "$SIGNED" "$ALIGNED"

          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -lh "$SIGNED"

      # Fails the job if the APK is unsigned, signed with the wrong key, or
      # missing the lineage that lets existing installs update in place.
      - name: Verify signature and lineage
        env:
          APK: ${{ steps.sign.outputs.apk }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/apksigner" lineage --in "$APK" --print-certs
          # API 24-27 do not read the v3 block, so they must verify via v2.
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 24 --max-sdk-version 27 "$APK"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.sign.outputs.apk }}
        run: |
          set -euo pipefail
          ASSET="DocScanner-Android-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$ASSET"
          NOTES="releases/${GITHUB_REF_NAME}/release_notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "DocScanner $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "DocScanner $GITHUB_REF_NAME" --generate-notes
          fi

