name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language != 'actions'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: matrix.language != 'actions'
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL's autobuilder resolves the AGP plugin classpath through its own
      # proxy init script and fails on this project, so the Android build is
      # invoked directly instead.
      #
      # --no-build-cache forces real compiler invocations (a cached build gives
      # CodeQL no code to extract) and in-process Kotlin compilation keeps the
      # compiler inside the JVM the tracer is attached to.
      - if: matrix.language == 'java-kotlin'
        name: Build Android sources (Manual)
        run: >
          ./gradlew :app:assembleGithubDebug
          --no-daemon --no-build-cache --no-configuration-cache
          -Dkotlin.compiler.execution.strategy=in-process
          -Pkotlin.compiler.execution.strategy=in-process
          --stacktrace

      - if: matrix.language == 'swift'
        name: Build Swift Code (Manual)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p /tmp/codeql_swift_build
          swiftc -sdk $SDK_PATH \
            -target arm64-apple-ios16.0 \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework UIKit \
            -framework SwiftUI \
            -framework VisionKit \
            -framework Vision \
            -framework LocalAuthentication \
            -framework PDFKit \
            -framework DocScannerKit \
            -o /tmp/codeql_swift_build/DocScanner \
            iosApp/iosApp/iOSApp.swift \
            iosApp/iosApp/ContentView.swift \
            iosApp/iosApp/ScannerView.swift \
            iosApp/iosApp/DocumentListView.swift \
            iosApp/iosApp/DocumentDetailView.swift \
            iosApp/iosApp/SettingsView.swift \
            iosApp/iosApp/OcrService.swift

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
