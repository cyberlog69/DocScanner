name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'autobuild'
        name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - if: matrix.language == 'swift'
        name: Build Swift Code (Manual)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p /tmp/codeql_swift_build
          swiftc -sdk $SDK_PATH \
            -target arm64-apple-ios16.0 \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework UIKit \
            -framework SwiftUI \
            -framework VisionKit \
            -framework Vision \
            -framework LocalAuthentication \
            -framework PDFKit \
            -framework DocScannerKit \
            -o /tmp/codeql_swift_build/DocScanner \
            iosApp/iosApp/iOSApp.swift \
            iosApp/iosApp/ContentView.swift \
            iosApp/iosApp/ScannerView.swift \
            iosApp/iosApp/DocumentListView.swift \
            iosApp/iosApp/DocumentDetailView.swift \
            iosApp/iosApp/SettingsView.swift \
            iosApp/iosApp/OcrService.swift

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
